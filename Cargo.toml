[package]
name = "mundo_sapiens"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mundo_sapiens"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui = "0.35.0"
egui_extras = "0.35.0"
chrono = "0.4"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros"] }
postgresql_embedded = "0.21.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
dirs = "6.0.0"
thiserror = "2.0.19"
